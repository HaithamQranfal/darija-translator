# Default configuration. Environment variables / -D system properties with the same names take precedence.
# LLM provider: gemini (cloud, free tier) | ollama (local lightweight LLM) | mock (offline demo)
LLM_PROVIDER=gemini
# Never commit your key: export GEMINI_API_KEY=... (https://aistudio.google.com/apikey)
GEMINI_MODEL=gemini-flash-latest
GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta
OLLAMA_URL=http://localhost:11434
OLLAMA_MODEL=qwen2.5:3b
LLM_TIMEOUT_SECONDS=60
CACHE_SIZE=500
MAX_TEXT_LENGTH=5000
